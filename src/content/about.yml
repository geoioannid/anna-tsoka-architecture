heading: >-
  Anna Tsoka Architecture is a small practice working on residential
  interiors, restorations and quiet public spaces.
bio: |
  Founded in 2018, the studio approaches each project as a slow conversation with place — with existing walls, with light, with the materials at hand.

  Work is developed through drawing and physical models, and built in close collaboration with local craftsmen.
services:
  - Architecture
  - Interior design
  - Restoration
  - Furniture
  - Art direction
